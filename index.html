<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Aktuelle COVID-19-7-Tage-Inzidenz für Deutschland und die Bundesländer">
  <title>COVID-19-Inzidenz | Deutschland und Bundesländer</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17212b;
      background: #f3f6f8;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
    }

    .page {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 48px 0 64px;
    }

    .intro {
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #526170;
      font-size: 0.75rem;
      font-weight: 750;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.25rem);
      letter-spacing: -0.045em;
      line-height: 1.05;
    }

    .national-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 48px;
      padding: clamp(24px, 5vw, 42px);
      border-radius: 20px;
      background: #173b57;
      color: white;
      box-shadow: 0 18px 40px #173b5726;
    }

    .national-card h2 {
      margin: 0 0 8px;
      font-size: clamp(1.25rem, 3vw, 1.7rem);
    }

    .national-card p {
      margin: 0;
      color: #c6d6e2;
      font-size: 0.95rem;
    }

    .national-value {
      text-align: right;
      white-space: nowrap;
    }

    .national-value strong {
      display: block;
      font-size: clamp(3rem, 8vw, 5.4rem);
      letter-spacing: -0.06em;
      line-height: 0.95;
    }

    .national-value span {
      display: block;
      margin-top: 10px;
      color: #c6d6e2;
      font-size: 0.85rem;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: -0.025em;
    }

    .section-heading p {
      margin: 0;
      color: #667582;
      font-size: 0.84rem;
    }

    .state-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .state-card {
      min-height: 118px;
      padding: 18px;
      border: 1px solid #e1e7eb;
      border-radius: 14px;
      background: white;
      box-shadow: 0 3px 12px #17212b08;
    }

    .state-card h3 {
      min-height: 2.5em;
      margin: 0 0 10px;
      color: #526170;
      font-size: 0.88rem;
      font-weight: 650;
      line-height: 1.25;
    }

    .state-value {
      font-size: 1.8rem;
      font-weight: 750;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .state-unit {
      margin-top: 6px;
      color: #778591;
      font-size: 0.72rem;
    }

    .status {
      min-height: 1.5em;
      margin: 20px 0 0;
      color: #667582;
      font-size: 0.84rem;
    }

    .source {
      margin: 28px 0 0;
      color: #7a8791;
      font-size: 0.75rem;
      text-align: right;
    }

    a {
      color: #145a86;
    }

    @media (max-width: 820px) {
      .state-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      .page {
        width: min(100% - 28px, 480px);
        padding-top: 30px;
      }

      .national-card {
        align-items: flex-start;
        flex-direction: column;
        gap: 28px;
        margin-bottom: 36px;
      }

      .national-value {
        text-align: left;
      }

      .section-heading {
        align-items: flex-start;
        flex-direction: column;
        gap: 5px;
      }

      .state-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .state-card {
        min-height: 108px;
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="intro">
      <p class="eyebrow">COVID-19 · 7-Tage-Inzidenz</p>
      <h1>Deutschland im Überblick</h1>
    </header>

    <section class="national-card" aria-labelledby="national-heading">
      <div>
        <h2 id="national-heading">Deutschland</h2>
        <p>Alle Altersgruppen</p>
      </div>
      <div class="national-value">
        <strong id="incidence" aria-live="polite">--</strong>
        <span>Fälle pro 100.000 Einwohner:innen</span>
      </div>
    </section>

    <section aria-labelledby="states-heading">
      <div class="section-heading">
        <h2 id="states-heading">Bundesländer</h2>
        <p>Sortiert nach Inzidenz · absteigend</p>
      </div>
      <div id="state-grid" class="state-grid" aria-live="polite"></div>
    </section>

    <p id="status" class="status" role="status" aria-live="polite">Aktuelle Daten werden geladen.</p>
    <p class="source">Quelle: <a href="https://github.com/robert-koch-institut/COVID-19_7-Tage-Inzidenz_in_Deutschland">Robert Koch-Institut</a> · <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a></p>
  </main>
  <script>
    const GERMANY_DATA_URL = 'https://raw.githubusercontent.com/robert-koch-institut/COVID-19_7-Tage-Inzidenz_in_Deutschland/main/COVID-19-Faelle_7-Tage-Inzidenz_Deutschland.csv';
    const STATES_DATA_URL = 'https://raw.githubusercontent.com/robert-koch-institut/COVID-19_7-Tage-Inzidenz_in_Deutschland/main/COVID-19-Faelle_7-Tage-Inzidenz_Bundeslaender.csv';
    const STATE_NAMES = {
      '01': 'Schleswig-Holstein',
      '02': 'Hamburg',
      '03': 'Niedersachsen',
      '04': 'Bremen',
      '05': 'Nordrhein-Westfalen',
      '06': 'Hessen',
      '07': 'Rheinland-Pfalz',
      '08': 'Baden-Württemberg',
      '09': 'Bayern',
      '10': 'Saarland',
      '11': 'Berlin',
      '12': 'Brandenburg',
      '13': 'Mecklenburg-Vorpommern',
      '14': 'Sachsen',
      '15': 'Sachsen-Anhalt',
      '16': 'Thüringen'
    };

    function* parseCsvRows(text) {
      let row = [];
      let field = '';
      let quoted = false;

      for (let index = 0; index < text.length; index += 1) {
        const character = text[index];

        if (quoted) {
          if (character === '"') {
            if (text[index + 1] === '"') {
              field += '"';
              index += 1;
            } else {
              quoted = false;
            }
          } else {
            field += character;
          }
          continue;
        }

        if (character === '"' && field.length === 0) {
          quoted = true;
        } else if (character === ',') {
          row.push(field);
          field = '';
        } else if (character === '\n') {
          row.push(field.replace(/\r$/, ''));
          yield row;
          row = [];
          field = '';
        } else {
          field += character;
        }
      }

      if (quoted) {
        throw new Error('Malformed CSV: unterminated quoted field.');
      }

      if (field.length > 0 || row.length > 0) {
        row.push(field.replace(/\r$/, ''));
        yield row;
      }
    }

    function isIsoDate(value) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) {
        return false;
      }

      const parsed = new Date(`${value}T00:00:00Z`);
      return !Number.isNaN(parsed.getTime()) && parsed.toISOString().slice(0, 10) === value;
    }

    function getHeaders(csv) {
      const rows = parseCsvRows(csv.replace(/^\uFEFF/, ''));
      const firstRow = rows.next();

      if (firstRow.done) {
        throw new Error('The CSV is empty.');
      }

      return { rows, headers: firstRow.value };
    }

    function selectLatest(csv) {
      const { rows, headers } = getHeaders(csv);
      const dateIndex = headers.indexOf('Meldedatum');
      const ageIndex = headers.indexOf('Altersgruppe');
      const incidenceIndex = headers.indexOf('Inzidenz_7-Tage');

      if ([dateIndex, ageIndex, incidenceIndex].some((index) => index < 0)) {
        throw new Error('The CSV is missing required columns.');
      }

      let latest = null;
      let latestCount = 0;

      for (const values of rows) {
        if (values[ageIndex] !== '00+') {
          continue;
        }

        const date = values[dateIndex] || '';
        if (!isIsoDate(date)) {
          throw new Error('The CSV contains an invalid all-ages report date.');
        }

        if (!latest || date > latest.date) {
          latest = { date, incidenceText: values[incidenceIndex] || '' };
          latestCount = 1;
        } else if (date === latest.date) {
          latestCount += 1;
        }
      }

      if (!latest) {
        throw new Error('The CSV has no all-ages rows.');
      }

      if (latestCount !== 1) {
        throw new Error('The latest all-ages row is duplicated.');
      }

      const incidence = Number(latest.incidenceText);
      if (latest.incidenceText === '' || !Number.isFinite(incidence) || incidence < 0) {
        throw new Error('The latest all-ages incidence is invalid.');
      }

      return { date: latest.date, incidence };
    }

    function selectLatestStates(csv) {
      const { rows, headers } = getHeaders(csv);
      const dateIndex = headers.indexOf('Meldedatum');
      const stateIndex = headers.indexOf('Bundesland_id');
      const ageIndex = headers.indexOf('Altersgruppe');
      const incidenceIndex = headers.indexOf('Inzidenz_7-Tage');

      if ([dateIndex, stateIndex, ageIndex, incidenceIndex].some((index) => index < 0)) {
        throw new Error('The state CSV is missing required columns.');
      }

      const latestByState = Object.create(null);

      for (const values of rows) {
        if (values[ageIndex] !== '00+') {
          continue;
        }

        const id = values[stateIndex] || '';
        if (!STATE_NAMES[id]) {
          throw new Error(`The state CSV contains an unknown Bundesland ID: ${id}.`);
        }

        const date = values[dateIndex] || '';
        if (!isIsoDate(date)) {
          throw new Error('The state CSV contains an invalid all-ages report date.');
        }

        const current = latestByState[id];
        if (!current || date > current.date) {
          latestByState[id] = {
            date,
            incidenceText: values[incidenceIndex] || '',
            count: 1
          };
        } else if (date === current.date) {
          current.count += 1;
        }
      }

      const states = Object.entries(STATE_NAMES).map(([id, name]) => {
        const latest = latestByState[id];
        if (!latest) {
          throw new Error(`The state CSV is missing all-ages data for Bundesland ${name}.`);
        }
        if (latest.count !== 1) {
          throw new Error(`The latest all-ages row for ${name} is duplicated.`);
        }

        const incidence = Number(latest.incidenceText);
        if (latest.incidenceText === '' || !Number.isFinite(incidence) || incidence < 0) {
          throw new Error(`The latest all-ages incidence for ${name} is invalid.`);
        }

        return { id, name, date: latest.date, incidence };
      });

      const reportDates = new Set(states.map((state) => state.date));
      if (reportDates.size !== 1) {
        throw new Error('The latest state data does not share one report date.');
      }

      return states.sort((first, second) =>
        second.incidence - first.incidence || first.name.localeCompare(second.name, 'de')
      );
    }

    async function loadCurrent(fetcher = globalThis.fetch) {
      const [germanyResponse, statesResponse] = await Promise.all([
        fetcher(GERMANY_DATA_URL),
        fetcher(STATES_DATA_URL)
      ]);

      if (!germanyResponse.ok) {
        throw new Error(`RKI Germany request failed (HTTP ${germanyResponse.status}).`);
      }
      if (!statesResponse.ok) {
        throw new Error(`RKI state request failed (HTTP ${statesResponse.status}).`);
      }

      const [germanyCsv, statesCsv] = await Promise.all([
        germanyResponse.text(),
        statesResponse.text()
      ]);
      const germany = selectLatest(germanyCsv);
      const states = selectLatestStates(statesCsv);

      if (states.some((state) => state.date !== germany.date)) {
        throw new Error('The Germany and state data do not share the same report date.');
      }

      return { germany, states };
    }

    function formatIncidence(value) {
      return new Intl.NumberFormat('de-DE', {
        minimumFractionDigits: 1,
        maximumFractionDigits: 1
      }).format(value);
    }

    window.GermanyIncidence = { selectLatest, selectLatestStates, loadCurrent };

    document.addEventListener('DOMContentLoaded', async () => {
      const incidenceElement = document.getElementById('incidence');
      const stateGridElement = document.getElementById('state-grid');
      const statusElement = document.getElementById('status');

      try {
        const current = await loadCurrent();
        incidenceElement.textContent = formatIncidence(current.germany.incidence);
        stateGridElement.replaceChildren(...current.states.map((state) => {
          const card = document.createElement('article');
          card.className = 'state-card';

          const name = document.createElement('h3');
          name.textContent = state.name;
          card.append(name);

          const value = document.createElement('div');
          value.className = 'state-value';
          value.textContent = formatIncidence(state.incidence);
          card.append(value);

          const unit = document.createElement('div');
          unit.className = 'state-unit';
          unit.textContent = 'pro 100.000';
          card.append(unit);

          return card;
        }));
        statusElement.textContent = 'Aktuelle RKI-Daten für alle Altersgruppen.';
      } catch (error) {
        console.error('Could not load the current RKI incidence data.', error);
        incidenceElement.textContent = '--';
        stateGridElement.replaceChildren();
        statusElement.textContent = 'Aktuelle Daten sind derzeit nicht verfügbar.';
      }
    });
  </script>
</body>
</html>
